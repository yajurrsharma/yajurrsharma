<svg xmlns="http://www.w3.org/2000/svg" width="750" height="150" viewBox="0 0 750 150" fill="none">
  <style>
    .bg { fill: #0d1117; rx: 10px; stroke: #30363d; stroke-width: 1px; }
    .text { font-family: 'Fira Code', 'Courier New', Consolas, monospace; font-size: 12px; fill: #ffffff; white-space: pre; }
    .prompt { fill: #d2a8ff; font-weight: bold; }
    .cmd { fill: #ffffff; }

    /* Base styling for each typed line */
    .line {
      display: inline-block;
      overflow: hidden;
      white-space: nowrap;
      width: 0;
      border-right: 2px solid transparent;
      animation-duration: 9s;
      animation-iteration-count: infinite;
      animation-timing-function: steps(60, end);
    }

    .line-1 {
      animation-name: type-line1;
    }

    .line-2 {
      animation-name: type-line2;
    }

    .line-3 {
      animation-name: type-line3;
    }

    /* Keyframes for Line 1 */
    @keyframes type-line1 {
      0% { width: 0; border-color: #ffffff; }
      20% { width: 100%; border-color: transparent; }
      80% { width: 100%; border-color: transparent; }
      90% { width: 0; border-color: transparent; }
      100% { width: 0; border-color: transparent; }
    }

    /* Keyframes for Line 2 */
    @keyframes type-line2 {
      0%, 22% { width: 0; border-color: transparent; }
      23% { border-color: #ffffff; }
      43% { width: 100%; border-color: transparent; }
      80% { width: 100%; border-color: transparent; }
      90% { width: 0; border-color: transparent; }
      100% { width: 0; border-color: transparent; }
    }

    /* Keyframes for Line 3 */
    @keyframes type-line3 {
      0%, 45% { width: 0; border-color: transparent; }
      46% { border-color: #ffffff; }
      66% { width: 100%; border-color: #ffffff; }
      80% { width: 100%; border-color: #ffffff; }
      90% { width: 0; border-color: transparent; }
      100% { width: 0; border-color: transparent; }
    }
  </style>

  <rect width="750" height="150" class="bg" />

  <g transform="translate(25, 20)">
    <!-- Terminal Window Buttons -->
    <circle cx="10" cy="10" r="5" fill="#ff5f56"/>
    <circle cx="28" cy="10" r="5" fill="#ffbd2e"/>
    <circle cx="46" cy="10" r="5" fill="#27c93f"/>

    <!-- Executed Command -->
    <text x="0" y="42" class="text">
      <tspan class="prompt">yajur@arch</tspan><tspan class="cmd">:~ $ ping -c 3 yajurrsharma.github.io</tspan>
    </text>

    <!-- Foreign Object to hold stacked animated div lines -->
    <foreignObject x="0" y="48" width="700" height="85">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Fira Code', 'Courier New', Consolas, monospace; font-size: 12px; color: #ffffff; padding-top: 5px; line-height: 1.6;">
        <div><span class="line line-1">64 bytes from portfolio: icmp_seq=1 ttl=64 time=0.42 ms</span></div>
        <div><span class="line line-2">64 bytes from portfolio: icmp_seq=2 ttl=64 time=0.38 ms</span></div>
        <div><span class="line line-3">--- 0% packet loss | status: 200 OK | brain state: overclocked ---</span></div>
      </div>
    </foreignObject>
  </g>
</svg>
