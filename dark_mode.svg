<svg xmlns="http://www.w3.org/2000/svg" width="850" height="410" viewBox="0 0 850 410" fill="none">
  <style>
    .bg { fill: #0d1117; rx: 12px; stroke: #30363d; stroke-width: 1px; }
    .text { font-family: 'Fira Code', 'Courier New', Consolas, monospace; font-size: 11px; white-space: pre; }
    .art { fill: #1793d1; font-weight: bold; }
