name: Generate Snake

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake game from commits
        uses: Platane/snk@v3
        with:
          github_user_name: yajurrsharma
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg
          palette: github-dark
          color_bg: "#0d1117"  
          color_wall: "#161b22" 
          color_snake: "#9400D3" 
          color_dots: "#39d353"  
          color_empty: "#0d1117" 

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: snake-animation
          path: dist/github-contribution-grid-snake-dark.svg

      - name: Push to GitHub
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          exclude_assets: '*.svg'  # Exclude all SVGs except the dark one
          include_assets: '*-dark.svg'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
